# Arduino UNO Q options on top of the meta-qcom kernel configuration
# (defconfig, prune.config, qcom.config and bsp-additions.cfg)

# RGB status LED, described as a leds-group-multicolor node
CONFIG_LEDS_GROUP_MULTICOLOR=m

# Audio: LPASS clock controller built in
CONFIG_SM_LPASSCC_6115=y

# The ANX7625 handles USB Type-C itself, do not use the TCPCI driver for it
CONFIG_TYPEC_TCPM=n

# Bluetooth Low Energy, disabled by the arm64 defconfig
CONFIG_BT_LE=y

# DisplayPort CEC tunneling through the ANX7625
CONFIG_DRM_DISPLAY_DP_AUX_CEC=y

# Media carrier panels, touch controller and camera
# (GPIO_WAVESHARE_DSI_TOUCH is not available in linux-qcom 6.18)
CONFIG_DRM_PANEL_SITRONIX_ST7701=m
CONFIG_DRM_PANEL_HIMAX_HX8394=m
CONFIG_DRM_PANEL_JADARD_JD9365DA_H3=m
CONFIG_GPIO_WAVESHARE_DSI_TOUCH=m
CONFIG_TOUCHSCREEN_GOODIX=m
CONFIG_VIDEO_IMX219=m

# Input and HID support for USB peripherals and virtual input devices
CONFIG_UHID=y
CONFIG_HIDRAW=y
CONFIG_INPUT_JOYDEV=m

# Many GStreamer plugins in the Qualcomm IMSDK use DMABUF userspace heaps
CONFIG_DMA_CMA=y
CONFIG_CMA_SIZE_MBYTES=256
CONFIG_UDMABUF=y

# Filesystems and memory compression
CONFIG_EXFAT_FS=y
CONFIG_ECRYPT_FS=y
CONFIG_ECRYPT_FS_MESSAGING=y
CONFIG_ZSWAP=y
