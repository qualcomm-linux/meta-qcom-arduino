# Misc configs for Monza devboards that should be in defconfig

# Microchip EMC2305 and compatible EMC2301/2/3; needed for fan control
CONFIG_SENSORS_EMC2305=m
# NXP PCA9635 16-channel PWM LED controller (on-board RGB LEDs via CCI I2C)
CONFIG_LEDS_PCA963X=m
# support for USB CAN adapters for demos and testing
#
# this enables popular hardware like CANable, Candlelight and PEAK System
# PCAN-USB, supported by the slcan, gs_usb and peak_usb drivers respectively

# Serial / USB serial CAN Adaptors (slcan)
CONFIG_CAN_SLCAN=m
# Geschwister Schneider UG and candleLight compatible interfaces
CONFIG_CAN_GS_USB=m
# PEAK PCAN-USB/USB Pro interfaces for CAN 2.0b/CAN-FD
CONFIG_CAN_PEAK_USB=m

# Bluetooth Low Energy, disabled by the arm64 defconfig
CONFIG_BT_LE=y

# Enabled by the arm64 defconfig, but disabled by the prune.config fragment
# from the qualcomm-linux kernel tree
#
# HDMI audio over the ADV7535 DSI-to-HDMI bridge; the sound card has an HDMI
# playback DAI link, so the whole card, the analog MAX98091 codec included,
# is only registered once the bridge provides its HDMI codec DAI
CONFIG_DRM_I2C_ADV7511_AUDIO=y
# TI INA232 power monitor (power-sensor@40 on i2c12)
CONFIG_SENSORS_INA2XX=m

# DMABUF userspace heaps, the CMA heap needs DMA_CMA
CONFIG_DMA_CMA=y
CONFIG_UDMABUF=y

# Drivers for devices described in the QCS8275 (monaco) SoC dtsi files
#
# PMIC5 Gen3 ADCs (monaco-pmics.dtsi)
CONFIG_QCOM_SPMI_ADC5_GEN3=m
# PDM GP M/N clock divider (not available in the kernel-topics 7.1 tree)
CONFIG_QCOM_CLK_GP_MND=m
# Arm RAS error reporting from the AEST description (not available in the
# kernel-topics 7.1 tree)
CONFIG_AEST=y
CONFIG_OF_AEST=y
