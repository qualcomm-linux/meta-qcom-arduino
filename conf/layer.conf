# We have a conf and classes directory, add to BBPATH
BBPATH .= ":${LAYERDIR}"

# We have a packages directory, add to BBFILES
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "qcom-arduino"
BBFILE_PATTERN_qcom-arduino := "^${LAYERDIR}/"
BBFILE_PRIORITY_qcom-arduino = "5"

LAYERDEPENDS_qcom-arduino = "core qcom"
LAYERSERIES_COMPAT_qcom-arduino = "wrynose"

BBFILES_DYNAMIC += " \
    qcom-distro:${LAYERDIR}/dynamic-layers/qcom-distro/*/*/*.bb \
    qcom-distro:${LAYERDIR}/dynamic-layers/qcom-distro/*/*/*.bbappend \
"
