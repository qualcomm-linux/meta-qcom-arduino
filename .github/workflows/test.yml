name: Tests

on:
  workflow_call:
    inputs:
      build_id:
        required: true
        type: string
      pr_number:
        required: false
        type: string
        description: "Pull request number. Added to the LAVA job metadata for PR builds"
      pr_url:
        required: false
        type: string
        description: "Pull request URL. Added to the LAVA job metadata for PR builds"
      pr_head_sha:
        required: false
        type: string
        description: "Head commit of the pull request. The known failures lists are read from it"
    outputs:
      summary_ids:
        description: "IDs of the test summary artifact"
        value: ${{ jobs.collect-ids.outputs.summary_ids }}
    secrets:
      LAVATOKEN:
        required: true
        description: "Token used to submit jobs to the LAVA lab"
env:
  # git sha, tag or branch in lava-test-plans repository. Must include the
  # project named in LAVA_TEST_PLANS_PROJECT.
  LAVA_TEST_PLANS_REF: "a64f1c400dec9569dfa9d920ba28162ca91cf9e6"
  # Project in lava-test-plans carrying the device templates and test plans
  # for the Arduino boards. They were added under the meta-qcom-3rdparty
  # project (lava-test-plans 773df66) when the boards lived in that layer;
  # switch to a meta-qcom-arduino project and bump LAVA_TEST_PLANS_REF once it
  # exists upstream.
  LAVA_TEST_PLANS_PROJECT: "meta-qcom-arduino"
  # CalVer tag in qcom-linux-testkit repository (format: testkit-YYYY.MM.DD).
  # Only boot test plans run here, so no test definition is pulled from it yet;
  # kept in sync with meta-qcom so the pin is meaningful once tests are added.
  TESTKIT_REF: "testkit-2026.09.27"

jobs:
  prepare-env:
    name: Prepare environment
    runs-on: ubuntu-latest
    steps:
      - name: "Print ref"
        shell: bash
        run: |
          echo "lava-test-plans ref: ${{ env.LAVA_TEST_PLANS_REF }}"
    outputs:
      lava-test-plans-ref: "${{ env.LAVA_TEST_PLANS_REF }}"
      lava-test-plans-project: "${{ env.LAVA_TEST_PLANS_PROJECT }}"
      testkit-ref: "${{ env.TESTKIT_REF }}"

  test-nodistro:
    needs: [prepare-env]
    name: "Test nodistro"
    permissions:
      contents: read
      actions: read
      checks: write
      pull-requests: write
    uses: $/.github/workflows/test-distro.yml
    secrets:
      LAVATOKEN: ${{ secrets.LAVATOKEN }}
    with:
      build_id: "${{ inputs.build_id }}"
      devices: "uno-q,ventuno-q"
      project_name: "${{ needs.prepare-env.outputs.lava-test-plans-project }}"
      distro_name: "nodistro"
      lava_test_plans_ref: "${{ needs.prepare-env.outputs.lava-test-plans-ref }}"
      testkit_ref: "${{ needs.prepare-env.outputs.testkit-ref }}"
      pr_number: "${{ inputs.pr_number }}"
      pr_url: "${{ inputs.pr_url }}"

  test-qcom-distro:
    needs: [prepare-env]
    name: "Test qcom-distro"
    permissions:
      contents: read
      actions: read
      checks: write
      pull-requests: write
    uses: $/.github/workflows/test-distro.yml
    secrets:
      LAVATOKEN: ${{ secrets.LAVATOKEN }}
    with:
      build_id: "${{ inputs.build_id }}"
      devices: "uno-q,ventuno-q"
      devices_premerge: "ventuno-q"
      project_name: "${{ needs.prepare-env.outputs.lava-test-plans-project }}"
      distro_name: "qcom-distro"
      kernel: "default"
      known_failures_file: "ci/known-failures/qcom-distro.yml"
      known_failures_ref: "${{ inputs.pr_head_sha }}"
      lava_test_plans_ref: "${{ needs.prepare-env.outputs.lava-test-plans-ref }}"
      testkit_ref: "${{ needs.prepare-env.outputs.testkit-ref }}"
      pr_number: "${{ inputs.pr_number }}"
      pr_url: "${{ inputs.pr_url }}"

  test-qcom-distro_linux-qcom-6-18:
    needs: [prepare-env]
    name: "Test qcom-distro_linux-qcom-6.18"
    permissions:
      contents: read
      actions: read
      checks: write
      pull-requests: write
    uses: $/.github/workflows/test-distro.yml
    secrets:
      LAVATOKEN: ${{ secrets.LAVATOKEN }}
    with:
      build_id: "${{ inputs.build_id }}"
      devices: "uno-q,ventuno-q"
      project_name: "${{ needs.prepare-env.outputs.lava-test-plans-project }}"
      distro_name: "qcom-distro"
      distro_suffix: "_linux-qcom-6.18"
      kernel: "linux-qcom-6.18"
      known_failures_file: "ci/known-failures/qcom-distro.yml"
      known_failures_ref: "${{ inputs.pr_head_sha }}"
      lava_test_plans_ref: "${{ needs.prepare-env.outputs.lava-test-plans-ref }}"
      testkit_ref: "${{ needs.prepare-env.outputs.testkit-ref }}"
      pr_number: "${{ inputs.pr_number }}"
      pr_url: "${{ inputs.pr_url }}"

  test-qcom-distro_linux-arduino:
    needs: [prepare-env]
    name: "Test qcom-distro_linux-arduino"
    permissions:
      contents: read
      actions: read
      checks: write
      pull-requests: write
    uses: $/.github/workflows/test-distro.yml
    secrets:
      LAVATOKEN: ${{ secrets.LAVATOKEN }}
    with:
      build_id: "${{ inputs.build_id }}"
      devices: "uno-q,ventuno-q"
      project_name: "${{ needs.prepare-env.outputs.lava-test-plans-project }}"
      distro_name: "qcom-distro"
      distro_suffix: "_linux-arduino"
      kernel: "linux-arduino"
      known_failures_file: "ci/known-failures/qcom-distro.yml"
      known_failures_ref: "${{ inputs.pr_head_sha }}"
      lava_test_plans_ref: "${{ needs.prepare-env.outputs.lava-test-plans-ref }}"
      testkit_ref: "${{ needs.prepare-env.outputs.testkit-ref }}"
      pr_number: "${{ inputs.pr_number }}"
      pr_url: "${{ inputs.pr_url }}"

  collect-ids:
    name: "Collect Summary artifact IDs"
    needs: [test-nodistro, test-qcom-distro, test-qcom-distro_linux-qcom-6-18, test-qcom-distro_linux-arduino]
    if: |
      always()
      && contains(needs.*.result, 'success')
      && !contains(needs.*.result, 'failure')
    runs-on: ubuntu-latest
    permissions:
      checks: write
      pull-requests: write
    outputs:
      summary_ids: ${{ steps.generate-summary.outputs.artifact_ids }}
    steps:
      - name: Summary IDs
        id: generate-summary
        env:
          NODISTRO_SUMMARY_ID: ${{ needs.test-nodistro.outputs.summary_id }}
          QCOM_DISTRO_SUMMARY_ID: ${{ needs.test-qcom-distro.outputs.summary_id }}
          QCOM_DISTRO_6_18_SUMMARY_ID: ${{ needs.test-qcom-distro_linux-qcom-6-18.outputs.summary_id }}
          QCOM_DISTRO_ARDUINO_SUMMARY_ID: ${{ needs.test-qcom-distro_linux-arduino.outputs.summary_id }}
        run: |
          echo "artifact_ids=${NODISTRO_SUMMARY_ID},${QCOM_DISTRO_SUMMARY_ID},${QCOM_DISTRO_6_18_SUMMARY_ID},${QCOM_DISTRO_ARDUINO_SUMMARY_ID}" >> $GITHUB_OUTPUT
