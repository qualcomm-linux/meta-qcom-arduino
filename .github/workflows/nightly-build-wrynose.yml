name: Nightly Build Dispatcher (wrynose)

on:
  schedule:
  # NOTE - changes to the cron spec should be pushed by https://github.com/quic-yocto-ci
  # so that build notification emails will be sent out properly.
  # At 23:22 UTC from Sunday to Friday - picked a random "minute" as top of
  # hour can be busy in github. Saturday is covered by the weekly build
  # dispatcher, which triggers a superset of this matrix on wrynose.
  - cron: "22 23 * * 0-5"

permissions:
  contents: read

jobs:
  trigger-build:
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Trigger Nightly Build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run --repo "${GITHUB_REPOSITORY}" --ref wrynose nightly-build.yml
